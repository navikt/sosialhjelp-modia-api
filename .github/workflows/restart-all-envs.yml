name: restart-all-envs.yml
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy_dev-gcp:
    uses: ./.github/workflows/deploy_dev.yml
    with:
      config-file-name: dev-gcp
    secrets: inherit
  deploy_mock:
    uses: ./.github/workflows/deploy_dev.yml
    with:
      config-file-name: mock
    secrets: inherit
  deploy_prod:
    uses: ./.github/workflows/deploy_prod.yml